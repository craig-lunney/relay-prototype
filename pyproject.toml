[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-prototype"
version = "0.1.0"
description = "Agent to Agent / Relay: controlled AI-to-AI engineering collaboration prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "setuptools>=68"]

[project.scripts]
relay = "relay.cli:main"
a2a   = "a2a.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["relay*", "a2a*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
