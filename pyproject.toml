[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[project]
name = "relay-prototype"
version = "0.1.0"
description = "Project Relay — Prototype 0: safe AI-to-AI engineering collaboration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
relay = "relay.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
